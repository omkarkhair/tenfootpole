<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tenfootpole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <section class="banner">
    <video class="banner-video" src="/media/bojutsu.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    <div class="banner-fade"></div>
    <h1 class="banner-title" aria-label="Ten Foot Pole">
      <span class="jp" aria-hidden="true">十尺棒</span>
      <span class="line l1">Ten</span>
      <span class="line l2">Foot</span>
      <span class="line l3">Pole</span>
    </h1>
    <p class="banner-tagline">
      <span class="tag-top">Some git repos,</span>
      <span class="tag-top">you wouldn't touch</span>
      <span class="tag-top">with a ten-foot pole.</span>
      <span class="tag-bottom">For the rest, you need one.</span>
    </p>
  </section>

  <main>
    <div class="card">
      <span class="bracket bracket-tl"></span>
      <span class="bracket bracket-tr"></span>
      <span class="bracket bracket-bl"></span>
      <span class="bracket bracket-br"></span>

      <form id="provision-form">
        <label for="repo-input" class="field-label">Git endpoint // 標的</label>
        <input
          type="text"
          id="repo-input"
          name="repo"
          placeholder="https://github.com/user/repo"
          autocomplete="off"
          spellcheck="false"
        />

        <button type="submit" id="poke-btn">
          <span class="btn-text" aria-label="Hajime, begin"><span class="word w-a"><span class="jp-word">始め!</span><small class="romaji">(Hajime)</small></span><span class="word w-b">Begin!</span></span>
          <span class="btn-spinner"></span>
        </button>

        <div id="status" class="status" hidden></div>
        <div id="capacity" class="capacity" hidden>
          <p id="capacity-msg"></p>
          <a id="deploy-btn" class="deploy-link" href="https://deploy.workers.cloudflare.com/?url=https://github.com/omkarkhair/tenfootpole" target="_blank" rel="noopener">
            <img src="https://deploy.workers.cloudflare.com/button" alt="Deploy to Cloudflare" />
          </a>
        </div>
        <div id="error" class="error" hidden></div>
      </form>
    </div>

    <p class="slots" id="slots" hidden></p>

    <footer class="footer">
      <span>Isolated cloud IDE powered by <a href="https://developers.cloudflare.com/sandbox/" target="_blank" rel="noopener">Cloudflare Sandbox</a></span>
      <span class="sep" aria-hidden="true"></span>
      <span>Host your own <a href="https://github.com/omkarkhair/tenfootpole" target="_blank" rel="noopener">GitHub</a></span>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
